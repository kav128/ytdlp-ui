schema: spec-driven

context: |
  Документация и общение ведутся на русском языке; идентификаторы — на английском.
  openspec/specs/ содержит согласованные требования целевого MVP, включая еще
  не реализованные возможности. Наличие основной спеки не означает готовность функции.
  Карта требований и границы MVP находятся в openspec/README.md.
  Общий технический проект находится в openspec/design.md: предложенные решения,
  технические defaults и открытые вопросы не считаются согласованными требованиями.
  Правила работы с репозиторием находятся в AGENTS.md; фактические команды,
  API и ограничения реализации — в readme.md. Сохраняй различие между ними.

rules:
  proposal:
    - Пиши на русском и явно указывай границы изменения и то, что остается за пределами MVP.
    - Перед добавлением capability проверяй существующие openspec/specs/ и сохраняй их идентификаторы.
  specs:
    - Пиши содержание на русском; сохраняй служебные заголовки OpenSpec и шаги WHEN/THEN на английском.
    - Используй ДОЛЖЕН/ДОЛЖНА/ДОЛЖНО (SHALL) для нормативных требований и проверяемые сценарии.
    - Не превращай предложения и defaults из openspec/design.md в требования без согласованного изменения.
  design:
    - Учитывай общий openspec/design.md и явно отделяй согласованные решения от предложений и открытых вопросов.
  tasks:
    - Указывай способ проверки выполнения каждой задачи и обновляй затронутую документацию вместе с реализацией.
