services:
  app:
    environment:
      ConnectionStrings__AppDatabase: Host=postgres;Database=ytdlp_ui;Username=ytdlp_ui;Password=${LOCAL_POSTGRES_PASSWORD:-local-development-password}
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    environment:
      POSTGRES_DB: ytdlp_ui
      POSTGRES_USER: ytdlp_ui
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:-local-development-password}
    ports:
      - "15432:5432"
    volumes:
      - local-postgres-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "ytdlp_ui", "-d", "ytdlp_ui" ]
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  local-postgres-data:
