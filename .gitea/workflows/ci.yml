name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: pc
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Setup Node.js
        shell: bash
        run: |
          case "$(uname -m)" in
            aarch64) arch=arm64 ;;
            x86_64) arch=x64 ;;
            *) echo "Unsupported runner architecture" >&2; exit 1 ;;
          esac
          version=v24.19.0
          archive="node-$version-linux-$arch.tar.xz"
          directory="$(mktemp -d)"
          cd "$directory"
          curl --fail --silent --show-error --location --max-time 120 --remote-name "https://nodejs.org/dist/$version/$archive"
          curl --fail --silent --show-error --location --max-time 30 --remote-name "https://nodejs.org/dist/$version/SHASUMS256.txt"
          grep "  $archive\$" SHASUMS256.txt | sha256sum --check --strict
          tar -xJf "$archive"
          echo "$directory/node-$version-linux-$arch/bin" >> "$GITHUB_PATH"
      - name: Restore React dependencies
        run: npm ci --no-audit --no-fund
        working-directory: src/Ytdlp.Ui.Client

      - name: Build React
        run: npm run build
        working-directory: src/Ytdlp.Ui.Client

      - name: Restore dependencies
        run: dotnet restore Ytdlp.Ui.slnx

      - name: Build
        run: dotnet build Ytdlp.Ui.slnx -c Release --no-restore

      - name: Unit tests
        run: dotnet test tests/Ytdlp.Ui.Tests/Ytdlp.Ui.Tests.csproj -c Release --no-build --verbosity normal

      - name: Integration tests
        run: dotnet test tests/Ytdlp.Ui.IntegrationTests/Ytdlp.Ui.IntegrationTests.csproj -c Release --no-build --verbosity normal

      - name: Test React
        run: npm test
        working-directory: src/Ytdlp.Ui.Client
      - name: Verify Moscow calendar version boundaries
        run: bash build/test-calendar-version.sh
      - name: Verify both publish modes and frontend output
        shell: bash
        run: |
          dotnet publish src/Ytdlp.Ui/Ytdlp.Ui.csproj -c Release --no-build -o artifacts/publish-no-build
          dotnet publish src/Ytdlp.Ui/Ytdlp.Ui.csproj -c Release --no-restore -o artifacts/publish
          for directory in artifacts/publish artifacts/publish-no-build; do
            test -s "$directory/wwwroot/index.html"
            find "$directory/wwwroot/assets" -name '*.js' | grep -q .
            while IFS= read -r -d '' asset; do
              cmp "$asset" "$directory/wwwroot/${asset#src/Ytdlp.Ui.Client/dist/}"
            done < <(find src/Ytdlp.Ui.Client/dist -type f -print0)
            test ! -d "$directory/ClientApp"
            test ! -d "$directory/node_modules"
          done

  docker:
    needs: build
    runs-on: pc
    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: git.kav128.myddns.me
      IMAGE_NAME: ytdlp-ui

    steps:
      - uses: actions/checkout@v6

      - name: Version
        id: get-version
        run: echo "version=$(bash build/calendar-version.sh HEAD "$GITHUB_RUN_NUMBER")" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.PACKAGES_TOKEN }}

      - name: Get image name
        id: get-image-name
        shell: bash
        run: echo "image-name=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.get-image-name.outputs.image-name }}
          tags: type=raw,value=${{ steps.get-version.outputs.version }}
          flavor: latest=false

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          context: .
          file: Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
